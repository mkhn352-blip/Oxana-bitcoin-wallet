
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oxana Bitcoin Pro - Wallet Test</title>
<style>
body {
  margin: 0;
  padding: 24px;
  background: #080e19;
  color: #f4f1e8;
  font-family: Arial, sans-serif;
  text-align: center;
}
.card {
  max-width: 480px;
  margin: 30px auto;
  padding: 24px;
  background: #121d2f;
  border: 1px solid #394962;
  border-radius: 18px;
}
h1 { color: #e9bd67; }
p { line-height: 1.8; color: #c3cede; }
button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 0;
  border-radius: 10px;
  background: #e9bd67;
  color: #17130a;
  font-size: 16px;
  font-weight: bold;
}
.secondary {
  background: #24344b;
  color: white;
}
#status, #address {
  overflow-wrap: anywhere;
  font-size: 14px;
}
</style>
</head>
<body>
<div class="card">
  <h1>₿ Oxana Bitcoin Pro</h1>
  <p>آزمایش اتصال کیف پول بیت‌کوین</p>
  <button id="connect">اتصال کیف پول</button>
  <button id="disconnect" class="secondary">قطع اتصال</button>
  <p id="status">در حال بارگذاری ابزار اتصال...</p>
  <p id="address" dir="ltr"></p>
</div>

<script type="module">
const PROJECT_ID = 'fd9f6af01ff8f8736f24318c0f8fa1e2';

const statusEl = document.getElementById('status');
const addressEl = document.getElementById('address');
const connectBtn = document.getElementById('connect');
const disconnectBtn = document.getElementById('disconnect');

let appKit = null;

connectBtn.addEventListener('click', async () => {
  if (!appKit) {
    statusEl.textContent =
      'ابزار اتصال هنوز بارگذاری نشده است. صفحه را تازه‌سازی کنید و اینترنت را بررسی کنید.';
    return;
  }

  try {
    statusEl.textContent = 'در حال باز کردن پنجره کیف پول...';
    await appKit.open({ view: 'Connect', namespace: 'bip122' });
    statusEl.textContent =
      'پنجره اتصال باز شد. کیف پول بیت‌کوین را انتخاب کنید.';
  } catch (error) {
    statusEl.textContent = 'خطای اتصال: ' + (error?.message || error);
  }
});

disconnectBtn.addEventListener('click', async () => {
  if (!appKit) {
    statusEl.textContent = 'ابزار اتصال بارگذاری نشده است.';
    return;
  }

  try {
    await appKit.disconnect({ namespace: 'bip122' });
    addressEl.textContent = '';
    statusEl.textContent = 'درخواست قطع اتصال انجام شد.';
  } catch (error) {
    statusEl.textContent =
      'خطای قطع اتصال: ' + (error?.message || error);
  }
});

async function startApp() {
  try {
    const { createAppKit } =
      await import('https://esm.sh/@reown/appkit@1.8.21');

    const { BitcoinAdapter } =
      await import('https://esm.sh/@reown/appkit-adapter-bitcoin@1.8.21');

    const { bitcoin } =
      await import('https://esm.sh/@reown/appkit/networks');

    appKit = createAppKit({
      adapters: [new BitcoinAdapter()],
      networks: [bitcoin],
      projectId: PROJECT_ID,
      metadata: {
        name: 'Oxana Bitcoin Pro',
        description: 'Bitcoin wallet connection test',
        url: 'https://mkhn352-blip.github.io',
        icons: []
      },
      features: {
        analytics: false,
        email: false,
        socials: false,
        onramp: false,
        swaps: false
      }
    });

    statusEl.textContent =
      'ابزار اتصال بارگذاری شد. برای شروع روی اتصال کیف پول بزنید.';

    if (typeof appKit.subscribeAccount === 'function') {
      appKit.subscribeAccount((state) => {
        const account = state?.address || state?.caipAddress || '';
        if (account) {
          addressEl.textContent = account;
          statusEl.textContent = 'اطلاعات حساب کیف پول دریافت شد.';
        }
      }, 'bip122');
    }
  } catch (error) {
    appKit = null;
    statusEl.textContent =
      'خطای بارگذاری: ' + (error?.message || error) +
      ' — اتصال اینترنت و بارگذاری کتابخانه را بررسی کنید.';
  }
}

startApp();
</script>
</body>
</html>
